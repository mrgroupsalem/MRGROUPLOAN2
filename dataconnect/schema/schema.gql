type User @table {
  displayName: String!
  email: String!
  createdAt: Timestamp!
  userType: String!
  phoneNumber: String
}

type LoanApplication @table {
  applicant: User!
  amountRequested: Float!
  purpose: String!
  applicationDate: Timestamp!
  status: String!
  desiredRepaymentMonths: Int
  notes: String
}

type Loan @table {
  applicant: User!
  application: LoanApplication!
  loanAmount: Float!
  interestRate: Float!
  startDate: Date!
  endDate: Date!
  status: String!
  monthlyPayment: Float
  outstandingBalance: Float
}

type Payment @table {
  loan: Loan!
  paymentDate: Timestamp!
  amountPaid: Float!
  notes: String
}